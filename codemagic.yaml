workflows:
  ios-unsigned-ipa:
    name: Unsigned iPhone IPA
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: latest
    scripts:
      - name: Compile, package and validate unsigned ARM64 Release
        script: bash scripts/build-unsigned-ipa.sh
    artifacts:
      - artifacts/Peach-iOS-Test-unsigned.ipa
      - artifacts/Peach-iOS-Test-unsigned.ipa.sha256
      - artifacts/ipa-validation.json
      - artifacts/build-summary.txt
      - build/xcodebuild.log
